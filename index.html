<!DOCTYPE html>
<html lang="pt-br">
<head>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickList</title>
  <link rel="stylesheet" href="styles/index.css">
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
</head>
<body>
  <header>
  <img src="assets/logo.svg" alt="Logo do QuickList">
</header>

  <main>
    <img src="assets/back-icon.svg" alt="Icone Voltar" id="btnVoltar">
    <h1>Compras da semana</h1>
    
    <form>
      <input id="inputItem" type="text" placeholder="Adicione um novo item" required>
      <button id="btnAddItem" type="submit">Adicionar item</button>
    </form>

  <ul id="listaItens">
    
  </ul>

  <footer class="oculta-aviso"> 
  <span class="item-removido">
    <img src="./assets/warning circle.svg" alt="Icone de atenção">
    O item foi removido da lista
    <img src="./assets/fechar.svg" alt="Icone de fechar aviso" id="btnFecharAviso">
  </span>
</footer>
</main>
<script src="script.js"></script>
</body>
</html>
